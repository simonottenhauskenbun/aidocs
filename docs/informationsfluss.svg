<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .opt { stroke-dasharray: 5 4; }
    .dec { fill: #dafbe1; stroke: #1a7f37; }
    .work { fill: #ddf4ff; stroke: #0969da; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s { fill: #57606a; font-size: 11.5px; text-anchor: middle; }
    .l { fill: #57606a; font-size: 11.5px; }
    .a { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#pfeil); }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .dec { fill: #12261e; stroke: #3fb950; }
      .work { fill: #0c2d4b; stroke: #58a6ff; }
      .t { fill: #e6edf3; }
      .s, .l { fill: #8b949e; }
      .a { stroke: #8b949e; }
      .ah { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="820" height="280" rx="8"/>

  <!-- Eingang -->
  <text class="l" x="80" y="84" text-anchor="middle">Idee, Anforderungen</text>
  <line class="a" x1="80" y1="90" x2="80" y2="118"/>

  <!-- PLAN -->
  <rect class="box opt" x="20" y="120" width="120" height="54" rx="6"/>
  <text class="t" x="80" y="144">PLAN.md</text>
  <text class="s" x="80" y="162">Grobplanung (optional)</text>
  <line class="a" x1="140" y1="147" x2="178" y2="147"/>

  <!-- TODO -->
  <rect class="box" x="180" y="120" width="120" height="54" rx="6"/>
  <text class="t" x="240" y="144">TODO.md</text>
  <text class="s" x="240" y="162">Schritte X.y</text>
  <line class="a" x1="300" y1="147" x2="338" y2="147"/>

  <!-- Umsetzung -->
  <rect class="box work" x="340" y="120" width="130" height="54" rx="6"/>
  <text class="t" x="405" y="144">Umsetzung</text>
  <text class="s" x="405" y="162">Agent hakt ab</text>

  <line class="a" x1="470" y1="135" x2="528" y2="70"/>
  <line class="a" x1="470" y1="147" x2="528" y2="147"/>
  <line class="a" x1="470" y1="159" x2="528" y2="224"/>

  <!-- Q, K, F -->
  <rect class="box" x="530" y="40" width="120" height="54" rx="6"/>
  <text class="t" x="590" y="64">Q-x</text>
  <text class="s" x="590" y="82">offene Frage</text>

  <rect class="box" x="530" y="120" width="120" height="54" rx="6"/>
  <text class="t" x="590" y="144">K-x</text>
  <text class="s" x="590" y="162">KI-Entscheidung</text>

  <rect class="box opt" x="530" y="200" width="120" height="54" rx="6"/>
  <text class="t" x="590" y="224">F-x</text>
  <text class="s" x="590" y="242">Erkenntnis (optional)</text>

  <!-- D -->
  <line class="a" x1="650" y1="67" x2="688" y2="95"/>
  <line class="a" x1="650" y1="147" x2="688" y2="119"/>
  <rect class="box dec" x="690" y="80" width="110" height="54" rx="6"/>
  <text class="t" x="745" y="104">D-x</text>
  <text class="s" x="745" y="122">Entscheidung</text>
  <text class="l" x="745" y="152" text-anchor="middle">vom User geklärt</text>
  <text class="l" x="745" y="167" text-anchor="middle">bzw. bestätigt</text>
</svg>
